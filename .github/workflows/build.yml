name: php-8.1-cve-windows

on: workflow_dispatch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        ts: [nts, ts]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          repository: php/php-src
          # PHP-8.1-CVE-2026-109618-109619 head (8.1.34 + backport for CVE-2026-109618/109619)
          ref: 1d7dec178a094e6e75b229ce22754045f8c6070a

      - uses: php/php-windows-builder/php@v1
        with:
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
