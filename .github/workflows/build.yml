name: php-8.1-cve-windows

on: workflow_dispatch

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        ts: [nts, ts]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          repository: php/php-src
          # PHP-8.1-CVE-2026-109618-109619 head (8.1.34 + backport for CVE-2026-109618/109619)
          ref: 1d7dec178a094e6e75b229ce22754045f8c6070a

      - uses: php/php-windows-builder/php@v1
        with:
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify CVE fix is in every binary
        run: |
          for z in artifacts/php-8.1.34-*.zip; do
            unzip -p "$z" 'php8*.dll' | grep -q zend_mm_safe_error_ex || { echo "::error::patch missing in $z"; exit 1; }
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create php-8.1.34-cve-2026-109618-109619 artifacts/php* \
            --title "PHP 8.1.34 Windows (CVE-2026-109618 / CVE-2026-109619 fix)" \
            --notes-file README.md
